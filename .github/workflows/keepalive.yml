name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake Reflex Cloud app
        run: |
          curl -fsS --max-time 30 --retry 3 --retry-delay 5 \
            https://polleria-red-sun.reflex.run/ >/dev/null
