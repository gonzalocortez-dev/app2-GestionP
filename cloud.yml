# Configuración Reflex Cloud — https://build.reflex.dev/
project: 5ef1c2cf-e6eb-4be6-a5ad-2f40e7090d6e

name: polleria
description: La Fábrica del Pollo — gestión integral (POS, inventario, finanzas)
# Secrets de producción (Supabase). NUNCA uses .env local (localhost).
envfile: .env.supabase
vmtype: c1m1
# Mantener al menos 1 instancia encendida (evita el sleep de ~5 min).
min_instances: 1
# SQLite incluido de Cloud NO persiste. La app usa PostgreSQL vía DATABASE_URL.
include_db: false
regions:
  sjc: 1
