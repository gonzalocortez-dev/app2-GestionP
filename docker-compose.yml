services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: polleria
      POSTGRES_PASSWORD: polleria
      POSTGRES_DB: polleria
    ports:
      - "5432:5432"
    volumes:
      - polleria_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polleria -d polleria"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  polleria_pgdata:
